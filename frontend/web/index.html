<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Registro de ponto VMac com suporte offline.">
  <meta name="theme-color" content="#8B0000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VMac Ponto">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>VMac Ponto</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Tela de carregamento enquanto o main.dart.js (alguns MB) chega. Sem
       isso o usuario ve uma pagina branca e acha que travou, principalmente
       no sinal fraco do campo. O Flutter remove este bloco ao assumir. */
    html, body { margin: 0; height: 100%; background: #F5F5F5; }
    #vmac-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: -apple-system, Roboto, Arial, sans-serif; color: #555;
      font-size: 14px; background: #F5F5F5; z-index: 1;
    }
    #vmac-splash img { width: 96px; height: 96px; border-radius: 20px; }
    #vmac-splash .spin {
      width: 28px; height: 28px; border: 3px solid #ddd; border-top-color: #8B0000;
      border-radius: 50%; animation: vmac-spin 0.9s linear infinite;
    }
    @keyframes vmac-spin { to { transform: rotate(360deg); } }
    /* Barra de porcentagem: so na abertura sem internet. */
    #vmac-progress { display: none; flex-direction: column; align-items: center; gap: 6px; }
    #vmac-progress .bar { width: 220px; height: 6px; border-radius: 3px; background: #ddd; overflow: hidden; }
    #vmac-progress .fill { height: 100%; width: 0; background: #8B0000; transition: width 0.15s linear; }
    #vmac-progress .pct { font-weight: bold; color: #8B0000; font-variant-numeric: tabular-nums; }
    @media (prefers-color-scheme: dark) {
      html, body, #vmac-splash { background: #000; color: #bbb; }
      #vmac-splash .spin { border-color: #333; border-top-color: #8B0000; }
      #vmac-progress .bar { background: #333; }
    }
    /* Aviso "Instalar o app" (so no navegador do celular, nunca no app ja
       instalado). Fica por cima da tela do Flutter. */
    #vmac-install {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 20;
      display: none; background: #fff; color: #222; border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,.28); padding: 16px 16px 14px;
      font-family: -apple-system, Roboto, Arial, sans-serif; font-size: 16px; line-height: 1.4;
      max-width: 460px; margin: 0 auto;
    }
    #vmac-install.show { display: block; animation: vmac-up .25s ease-out; }
    @keyframes vmac-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    #vmac-install .top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    #vmac-install .top img { width: 48px; height: 48px; border-radius: 11px; border: 1px solid #eee; }
    #vmac-install .title { font-weight: bold; font-size: 18px; color: #8B0000; }
    #vmac-install .steps { margin: 4px 0 12px; padding: 0; list-style: none; }
    #vmac-install .steps li { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    #vmac-install .num { flex: 0 0 26px; height: 26px; border-radius: 50%; background: #8B0000; color: #fff;
      font-weight: bold; display: grid; place-items: center; font-size: 15px; }
    #vmac-install .glyph { display: inline-flex; vertical-align: middle; width: 26px; height: 26px;
      border: 1px solid #ccc; border-radius: 6px; align-items: center; justify-content: center; margin: 0 2px; }
    #vmac-install .buttons { display: flex; gap: 10px; }
    #vmac-install button { flex: 1; padding: 14px; border-radius: 12px; font-size: 17px; font-weight: bold; border: 0; cursor: pointer; }
    #vmac-install .go { background: #8B0000; color: #fff; }
    #vmac-install .later { background: #eee; color: #444; }
    #vmac-install .arrow { text-align: center; font-size: 30px; color: #8B0000; margin-top: 6px; animation: vmac-bounce 1.2s infinite; }
    @keyframes vmac-bounce { 50% { transform: translateY(6px); } }
    @media (prefers-color-scheme: dark) {
      #vmac-install { background: #1e1e1e; color: #eee; }
      #vmac-install .later { background: #333; color: #ddd; }
      #vmac-install .glyph { border-color: #555; }
    }
  </style>
</head>
<body>
  <div id="vmac-splash">
    <img src="icons/Icon-192.png?v=2" alt="">
    <div class="spin"></div>
    <div id="vmac-progress">
      <div class="bar"><div class="fill" id="vmac-progress-fill"></div></div>
      <div class="pct" id="vmac-progress-pct">Abrindo... 0%</div>
    </div>
    <div id="vmac-splash-text">Abrindo o VMac Ponto...</div>
  </div>

  <script>
    // Recarga feita pela atualizacao automatica: a tela de abertura explica.
    try {
      if (sessionStorage.getItem('vmac-updating')) {
        sessionStorage.removeItem('vmac-updating');
        document.getElementById('vmac-splash-text').textContent = 'Atualizando o VMac Ponto...';
      }
    } catch (e) {}

    // ATUALIZACAO AUTOMATICA (ver pwa_service_worker.js e
    // lib/services/update_service.dart). Quando o service worker de uma
    // versao nova termina de baixar tudo e assume esta pagina, o navegador
    // dispara 'controllerchange' e marcamos vmacUpdateReady; o app recarrega
    // sozinho quando ninguem estiver usando a tela. Na primeira visita o
    // service worker tambem assume a pagina, mas ai nao ha versao anterior:
    // por isso so conta quando ja havia um controlando.
    window.vmacUpdateReady = false;
    window.vmacCheckForUpdate = function () { return Promise.resolve(); };
    window.vmacApplyUpdate = function (force) {
      // Trava contra recarga em loop: no automatico, no maximo uma a cada 2
      // min. O toque em ATUALIZAR (force) sempre recarrega.
      var KEY = 'vmac-auto-update-at';
      try {
        var last = parseInt(localStorage.getItem(KEY) || '0', 10);
        if (!force && last && Date.now() - last < 120000) return false;
        localStorage.setItem(KEY, String(Date.now()));
        sessionStorage.setItem('vmac-updating', '1');
      } catch (e) {}
      location.reload();
      return true;
    };
    if ('serviceWorker' in navigator) {
      var vmacHadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (vmacHadController) window.vmacUpdateReady = true;
        vmacHadController = true;
      });
      // O service worker novo pergunta, ao ativar, se esta pagina ja sabe se
      // atualizar sozinha; a que nao responde (app de antes desta versao) e
      // recarregada por ele. Esta responde e cuida da propria recarga.
      navigator.serviceWorker.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'VMAC_PING' && event.ports && event.ports[0]) {
          event.ports[0].postMessage({ type: 'VMAC_PONG' });
        }
      });
      navigator.serviceWorker.startMessages();
      // Confere so quando a pessoa usa o app: ao abrir (voltar para a tela),
      // trocar de aba ou registrar ponto (lib/services/update_service.dart),
      // e no maximo uma vez a cada 5 min. Cada conferencia e um pedido
      // pequeno do pwa_service_worker.js; sem mudanca o servidor responde
      // "nao mudou". Nada de conferir com o app parado.
      var vmacLastCheck = 0;
      window.vmacCheckForUpdate = function () {
        if (Date.now() - vmacLastCheck < 5 * 60 * 1000) return Promise.resolve();
        vmacLastCheck = Date.now();
        return navigator.serviceWorker.getRegistration()
          .then(function (reg) { return reg && reg.update(); })
          .catch(function () {});
      };
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') window.vmacCheckForUpdate();
      });
    }

    // Registra o service worker que guarda o app para uso offline
    // (frontend/web/pwa_service_worker.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('pwa_service_worker.js', { scope: '/' })
          .catch(function (err) { console.warn('Service worker nao registrado:', err); });

        // Aquecimento do cache: manda ao service worker a lista do que esta
        // pagina carregou (canvaskit, fontes, imagens, SDK do Firebase, fontes do Google) para
        // ele guardar. Na primeira visita ele ainda nao intercepta nada, e
        // sem isso a primeira abertura offline falharia nesses arquivos.
        var vmacSent = {};
        function vmacWarmCache() {
          navigator.serviceWorker.ready.then(function (reg) {
            if (!reg.active) return;
            var urls = performance.getEntriesByType('resource')
              .map(function (e) { return e.name; })
              .filter(function (u) {
                if (vmacSent[u]) return false;
                return u.indexOf(location.origin + '/') === 0 ||
                  u.indexOf('https://www.gstatic.com/firebasejs/') === 0 ||
                  u.indexOf('https://fonts.gstatic.com/') === 0;
              });
            if (!urls.length) return;
            urls.forEach(function (u) { vmacSent[u] = true; });
            reg.active.postMessage({ type: 'CACHE_URLS', urls: urls });
          }).catch(function () {});
        }
        [3000, 15000, 45000, 120000].forEach(function (ms) { setTimeout(vmacWarmCache, ms); });
      });
    }

    // Porcentagem da abertura (so sem internet, quando ela demora mais).
    // O navegador nao informa o progresso real, entao cada etapa vale uma
    // faixa e a barra anda devagar dentro dela, sem nunca passar do fim
    // da etapa antes de ela terminar. O flutter_bootstrap.js avisa a troca
    // de etapa; o app (StartupLoading) continua de 80% em diante.
    var vmacStages = { start: [0, 40], entrypoint: [40, 70], engine: [70, 80] };
    var vmacProgress = { from: 0, to: 40, t0: Date.now() };
    function vmacPercent() {
      var t = (Date.now() - vmacProgress.t0) / 1000;
      return vmacProgress.from + (vmacProgress.to - vmacProgress.from) * (1 - Math.exp(-t / 4));
    }
    window.vmacSetStage = function (name) {
      var stage = vmacStages[name];
      if (!stage) return;
      vmacProgress = { from: Math.max(stage[0], vmacPercent()), to: stage[1], t0: Date.now() };
    };

    if (!navigator.onLine) {
      var spinner = document.querySelector('#vmac-splash .spin');
      if (spinner) spinner.remove();
      document.getElementById('vmac-progress').style.display = 'flex';
      var vmacTimer = setInterval(function () {
        var fill = document.getElementById('vmac-progress-fill');
        var pct = document.getElementById('vmac-progress-pct');
        if (!fill || !pct) { clearInterval(vmacTimer); return; }
        var value = Math.floor(vmacPercent());
        fill.style.width = value + '%';
        pct.textContent = 'Abrindo... ' + value + '%';
      }, 150);
      var text = document.getElementById('vmac-splash-text');
      if (text) text.innerHTML = '<b>Voc\u00ea est\u00e1 sem internet</b><br>O app vai abrir com os dados salvos no aparelho. Sem sinal isso pode levar alguns segundos.';
      if (text) text.style.cssText = 'max-width:320px;text-align:center;line-height:1.5;padding:0 16px';
    }

    // O Flutter monta a interface dentro de <flutter-view>; quando ele
    // aparece, a tela de carregamento sai.
    var vmacObserver = new MutationObserver(function () {
      if (document.querySelector('flutter-view')) {
        var splash = document.getElementById('vmac-splash');
        if (splash) splash.remove();
        vmacObserver.disconnect();
      }
    });
    vmacObserver.observe(document.body, { childList: true, subtree: true });

    // Se em 45s o app nao subiu (sem internet e sem copia salva, ou arquivo
    // que nao baixou), troca o spinner por uma orientacao em vez de girar
    // para sempre.
    setTimeout(function () {
      var splash = document.getElementById('vmac-splash');
      if (!splash) return;
      var spin = splash.querySelector('.spin');
      if (spin) spin.remove();
      var text = document.getElementById('vmac-splash-text');
      if (text) {
        text.innerHTML = navigator.onLine
          ? 'O app esta demorando para carregar. Verifique a conexao e toque para tentar de novo.'
          : 'Sem internet, o app ainda est\u00e1 abrindo a c\u00f3pia salva no aparelho. Se n\u00e3o abrir, toque aqui para tentar de novo. Se nunca abriu este app com internet neste aparelho, abra uma vez com internet para liberar o uso offline.';
        text.style.cssText = 'max-width:320px;text-align:center;line-height:1.5;padding:0 16px;cursor:pointer';
        text.onclick = function () { location.reload(); };
      }
    }, 45000);
  </script>
  <!-- Aviso "Instalar o app do ponto". Android: botao que abre a instalacao
       do proprio celular. iPhone: a Apple nao deixa site instalar sozinho,
       entao o aviso mostra os dois toques (Compartilhar > Adicionar a Tela de
       Inicio). Nao aparece no app ja instalado; "Agora nao" esconde 3 dias. -->
  <div id="vmac-install" role="dialog" aria-label="Instalar o app do ponto">
    <div class="top">
      <img src="icons/Icon-192.png?v=2" alt="">
      <div><div class="title">Instale o app do ponto</div><div>Fica um &iacute;cone na tela do celular, igual a um aplicativo.</div></div>
    </div>
    <div id="vmac-install-body"></div>
    <div class="buttons">
      <button class="later" id="vmac-install-later" type="button">Agora n&atilde;o</button>
      <button class="go" id="vmac-install-go" type="button" style="display:none">Instalar</button>
    </div>
  </div>
  <script>
    (function () {
      var KEY = 'vmac-install-dismissed-at';
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var installed = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true;
      var deferredPrompt = null;
      var box = document.getElementById('vmac-install');
      var body = document.getElementById('vmac-install-body');
      var go = document.getElementById('vmac-install-go');

      function dismissedRecently() {
        try {
          var at = parseInt(localStorage.getItem(KEY) || '0', 10);
          return at && (Date.now() - at) < 3 * 24 * 3600 * 1000;
        } catch (e) { return false; }
      }
      function hide(remember) {
        box.classList.remove('show');
        if (remember) { try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {} }
      }
      var shareIcon = '<span class="glyph" aria-label="Compartilhar"><svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="#1a73e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V1M4.5 4.5 8 1l3.5 3.5"/><path d="M5 7H2.5v9.5h11V7H11"/></svg></span>';
      var plusIcon = '<span class="glyph" aria-label="Adicionar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#444" stroke-width="1.8" stroke-linecap="round"><rect x="1.5" y="1.5" width="13" height="13" rx="3"/><path d="M8 5v6M5 8h6"/></svg></span>';
      var menuIcon = '<span class="glyph" aria-label="Menu"><svg width="4" height="16" viewBox="0 0 4 16" fill="#444"><circle cx="2" cy="2" r="1.7"/><circle cx="2" cy="8" r="1.7"/><circle cx="2" cy="14" r="1.7"/></svg></span>';

      function steps(items) {
        return '<ul class="steps">' + items.map(function (s, i) {
          return '<li><span class="num">' + (i + 1) + '</span><span>' + s + '</span></li>';
        }).join('') + '</ul>';
      }
      function showIOS() {
        body.innerHTML = steps([
          'Toque no bot&atilde;o ' + shareIcon + ' <b>Compartilhar</b> (na barra do Safari; se n&atilde;o achar, toque antes em <b>&middot;&middot;&middot;</b>)',
          'Toque em ' + plusIcon + ' <b>Adicionar &agrave; Tela de In&iacute;cio</b> e depois em <b>Adicionar</b>'
        ]) + '<div class="arrow">&#8595;</div>';
        go.style.display = 'none';
        box.classList.add('show');
      }
      function showAndroidButton() {
        body.innerHTML = '';
        go.style.display = '';
        box.classList.add('show');
      }
      function showAndroidManual() {
        body.innerHTML = steps([
          'Toque no menu ' + menuIcon + ' do navegador (canto de cima)',
          'Toque em <b>Instalar app</b> ou <b>Adicionar &agrave; tela inicial</b>'
        ]);
        go.style.display = 'none';
        box.classList.add('show');
      }

      // Chrome/Android avisa que da para instalar: guarda o evento para o botao.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        if (box.classList.contains('show')) showAndroidButton();
      });
      window.addEventListener('appinstalled', function () { hide(false); deferredPrompt = null; });
      document.getElementById('vmac-install-later').onclick = function () { hide(true); };
      go.onclick = function () {
        if (!deferredPrompt) { showAndroidManual(); return; }
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function (choice) {
          if (choice && choice.outcome === 'accepted') hide(false);
        }).catch(function () {});
        deferredPrompt = null;
      };

      if (installed || !(isIOS || isAndroid) || dismissedRecently()) return;

      // Aparece alguns segundos depois de o app abrir, para nao cobrir a
      // abertura. No Android espera o Chrome liberar a instalacao; se ele nao
      // liberar (outro navegador), mostra o caminho pelo menu.
      function whenAppVisible(fn) {
        if (document.querySelector('flutter-view')) return fn();
        var obs = new MutationObserver(function () {
          if (document.querySelector('flutter-view')) { obs.disconnect(); fn(); }
        });
        obs.observe(document.body, { childList: true, subtree: true });
      }
      whenAppVisible(function () {
        setTimeout(function () {
          if (isIOS) showIOS();
          else if (deferredPrompt) showAndroidButton();
          else showAndroidManual();
        }, 4000);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
