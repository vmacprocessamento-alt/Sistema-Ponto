name: ponto_app
description: Sistema de Registro de Ponto (app web/PWA)
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_messaging: ^15.1.0

  # HTTP & API
  http: ^1.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.1.4
  
  # UI
  # Fonte de icones que o Flutter usa por dentro no iPhone (Safari); sem ela
  # alguns icones viram quadrados. So os icones usados vao para o app.
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  fl_chart: ^0.65.0
  
  # Localizacao da batida (API do navegador)
  geolocator: ^10.1.0
  
  # Arquivos (exportacao, PDF para assinatura, audio do chat)
  archive: ^3.6.1
  file_saver: ^0.2.10
  record: ^7.0.0
  url_launcher: ^6.3.2
  firebase_storage: ^12.4.10
  audioplayers: ^6.7.1
  # API do navegador (notificacoes, seletor de PDF).
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/templates/Excel-Administrativos/
    - assets/templates/Excel-Campo/

  # Roboto embutida (Apache 2.0, ver assets/fonts/LICENSE.txt). No web o
  # Flutter baixaria a fonte do fonts.gstatic.com a cada abertura; offline o
  # app abria sem nenhum texto.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
